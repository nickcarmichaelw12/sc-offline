name: Kiosk diagnostic build

on:
  push:
    branches: [codex/kiosk-diag1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Pinned: the project builds with the v145 toolset, which this image carries (VS 2026).
    runs-on: windows-2025-vs2026

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
        with:
          msbuild-architecture: x64

      - name: Build (Release x64)
        run: msbuild sc-offline.slnx /p:Configuration=Release /p:Platform=x64 /m

      # Release|x64 links with GenerateDebugInformation=false, so there is no PDB to upload.
      - name: Upload DLL + launcher artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kiosk-diagnostic-binaries
          path: |
            x64/Release/dinput8.dll
            x64/Release/sc-offline.exe
          if-no-files-found: error
          retention-days: 30
